version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: capstone_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: student_task_manager
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d